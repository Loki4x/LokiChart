name: Build APK Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependensi
        run: npm ci

      - name: Buat proyek Android (Capacitor)
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Siapkan keystore (dari Secrets GitHub)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 belum diisi — membuat APK debug. Update APK berikutnya mungkin harus uninstall dulu."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK release (bertanda tangan)
        if: steps.keystore.outputs.signed == 'true'
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="${KEY_PASS:-$KS_PASS}"
          cp app/build/outputs/apk/release/app-release.apk ../LokiChart.apk

      - name: Simpan debug keystore antar build (agar APK debug bisa di-update)
        if: steps.keystore.outputs.signed != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore

      - name: Build APK debug
        if: steps.keystore.outputs.signed != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../LokiChart.apk

      - name: Unggah APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: LokiChart-apk
          path: LokiChart.apk

      - name: Rilis ke GitHub Releases (saat push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LokiChart.apk
