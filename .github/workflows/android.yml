name: Build APK Android

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      versi:
        description: 'Versi rilis (mis. 1.1.0). Kosongkan untuk build tanpa rilis.'
        required: false
        default: ''

permissions:
  contents: write

# satu build per waktu agar nomor versi tidak bentrok
concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependensi
        run: npm ci

      - name: Tentukan versi
        id: ver
        env:
          INPUT_VERSI: ${{ inputs.versi }}
        run: |
          LAST=$(git tag -l 'v*' --sort=-v:refname | head -1)
          PKG=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSI" ]; then
            V="${INPUT_VERSI#v}"
          elif [ -z "$LAST" ]; then
            V="$PKG"
          else
            IFS=. read -r MA MI PA <<< "${LAST#v}"
            V="$MA.$MI.$((PA + 1))"
            # naikkan versi minor/mayor dengan mengubah "version" di package.json
            if [ "$(printf '%s\n%s\n' "$V" "$PKG" | sort -V | tail -1)" = "$PKG" ] && [ "$PKG" != "${LAST#v}" ]; then V="$PKG"; fi
          fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "last=$LAST" >> "$GITHUB_OUTPUT"
          {
            echo 'notes<<CATATAN_EOF'
            if [ -n "$LAST" ]; then git log --pretty='- %s' "$LAST..HEAD"; else git log --pretty='- %s' -n 20; fi
            echo 'CATATAN_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "Versi: $V (kode ${{ github.run_number }}), tag terakhir: ${LAST:-tidak ada}"

      - name: Buat proyek Android (Capacitor)
        run: |
          echo "export const VERSION = '${{ steps.ver.outputs.name }}';" > public/js/version.js
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"${{ steps.ver.outputs.name }}\"/" android/app/build.gradle
          grep -q POST_NOTIFICATIONS android/app/src/main/AndroidManifest.xml || \
            sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />#' android/app/src/main/AndroidManifest.xml
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Siapkan keystore (dari Secrets GitHub)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 belum diisi — membuat APK debug. Update APK berikutnya mungkin harus uninstall dulu."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK release (bertanda tangan)
        if: steps.keystore.outputs.signed == 'true'
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="${KEY_PASS:-$KS_PASS}"
          cp app/build/outputs/apk/release/app-release.apk ../LokiChart.apk

      - name: Simpan debug keystore antar build (agar APK debug bisa di-update)
        if: steps.keystore.outputs.signed != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore

      - name: Build APK debug
        if: steps.keystore.outputs.signed != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../LokiChart.apk

      - name: Beri nama APK sesuai versi
        run: cp LokiChart.apk "LokiChart-v${{ steps.ver.outputs.name }}.apk"

      - name: Unggah APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: LokiChart-apk
          path: LokiChart-v*.apk

      - name: Rilis ke GitHub Releases (setiap push ke main, tag v*, atau input versi)
        if: github.event_name == 'push' || github.event_name == 'release' || inputs.versi != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: LokiChart v${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            ### Perubahan
            ${{ steps.ver.outputs.notes }}

            ### Cara install
            APK Android LokiChart. Unduh file **LokiChart-v${{ steps.ver.outputs.name }}.apk** di bawah lalu install di HP
            (izinkan "instal dari sumber tidak dikenal" bila diminta).
            Isi kredensial OANDA / FOREX.com di aplikasi lewat ikon ⚙.
          files: LokiChart-v${{ steps.ver.outputs.name }}.apk
