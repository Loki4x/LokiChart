<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <title>Analis Chart</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button id="symbolBtn" class="sym-btn" title="Cari simbol">
        <span id="symIcon" class="sym-icon"></span>
        <span id="symName">XAUUSD</span>
        <span id="symBroker" class="broker-chip">OANDA</span>
      </button>
      <div id="tfBar" class="seg"></div>
      <select id="chartType" title="Jenis chart">
        <option value="candles">Candle</option>
        <option value="hollow">Candle Kosong</option>
        <option value="heikin">Heikin Ashi</option>
        <option value="bars">Bar</option>
        <option value="line">Garis</option>
        <option value="area">Area</option>
      </select>
      <div class="dropdown">
        <button id="indBtn" class="btn">ƒx Indikator</button>
        <div id="indMenu" class="menu hidden"></div>
      </div>
      <div class="spacer"></div>
      <span id="srcBadge" class="src-badge"></span>
      <button class="icon-btn" id="undoBtn" title="Batalkan (Ctrl+Z)"></button>
      <button class="icon-btn" id="redoBtn" title="Ulangi (Ctrl+Y)"></button>
      <button class="icon-btn" id="themeBtn" title="Tema terang/gelap"></button>
      <button class="icon-btn" id="shotBtn" title="Simpan gambar chart"></button>
      <button class="icon-btn" id="fullBtn" title="Layar penuh"></button>
      <button class="icon-btn" id="wlBtn" title="Daftar pantau"></button>
    </header>

    <main id="main">
      <nav id="rail"></nav>
      <section id="chartWrap">
        <div id="chart"></div>
        <div id="legend"></div>
        <div id="drawBar" class="hidden"></div>
        <button id="goLatest" class="go-latest hidden" title="Ke bar terbaru">»</button>
        <div id="toast" class="toast hidden"></div>

        <!-- Panel alat gambar -->
        <div id="drawPanel" class="panel hidden">
          <div class="panel-head">
            <h2>Gambar</h2>
            <button class="icon-btn" id="closeDraw" title="Tutup"></button>
          </div>
          <div class="search">
            <span class="search-ico"></span>
            <input id="toolSearch" placeholder="Cari" />
          </div>
          <div id="toolTabs" class="chips"></div>
          <div id="toolGrid" class="grid"></div>
        </div>
      </section>

      <aside id="watchlist" class="hidden">
        <div class="wl-head">
          <h3>Daftar Pantau</h3>
          <button class="icon-btn" id="wlAdd" title="Tambah simbol"></button>
        </div>
        <div class="wl-cols"><span>Simbol</span><span>Terakhir</span><span>Perb%</span></div>
        <div id="wlList"></div>
        <div id="overview"></div>
      </aside>
    </main>
  </div>

  <!-- Modal pencarian simbol -->
  <div id="searchModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-search">
        <button class="icon-btn" id="closeSearch" title="Kembali"></button>
        <input id="symSearch" placeholder="Cari simbol, mis. XAUUSD" autocomplete="off" />
      </div>
      <div id="symTabs" class="chips"></div>
      <div id="symList" class="sym-list"></div>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
