<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>LokiChart</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <div id="pages">
      <!-- ================= DAFTAR PANTAU ================= -->
      <section id="pg-watch" class="page">
        <div class="watch-list">
          <header class="pg-head">
            <button class="list-title" id="wlTitle">Daftar Pantau ▾</button>
            <button class="pill" id="wlAdd">+ Tambah simbol</button>
            <span class="spacer"></span>
            <button class="icon-btn" id="wlSearch" title="Cari"></button>
          </header>
          <div id="wlList"></div>
          <button class="add-sym" id="wlAdd2">+ Tambah Simbol</button>
        </div>
        <div class="watch-detail" id="overview"></div>
      </section>

      <!-- ================= CHART ================= -->
      <section id="pg-chart" class="page">
        <main id="main">
          <nav id="rail" class="hidden"></nav>
          <section id="chartWrap">
            <div id="charts"></div>
            <span id="srcBadge" class="src-badge"></span>
            <div id="drawBar" class="hidden"></div>
            <div id="studyBar" class="hidden"></div>
            <div id="symBar" class="hidden"></div>
            <div id="stepBanner" class="hidden"><span class="sb-k"></span><span class="sb-t"></span><button class="icon-btn sm" id="stepCancel" title="Batal menggambar"></button></div>
            <div id="toast" class="toast hidden"></div>

            <div id="drawPanel" class="panel hidden">
              <div class="panel-head"><h2>Gambar</h2><button class="icon-btn" id="closeDraw" title="Tutup"></button></div>
              <div class="search"><span class="search-ico"></span><input id="toolSearch" placeholder="Cari" /></div>
              <div id="toolTabs" class="chips"></div>
              <div id="toolGrid" class="grid"></div>
            </div>

            <div id="layoutPanel" class="panel hidden">
              <div class="panel-head"><h2>Layout</h2><button class="icon-btn" id="closeLayout" title="Tutup"></button></div>
              <button class="pill" id="syncBtn">Sinkronisasi dalam layout ▾</button>
              <div id="layoutGrid" class="layout-grid"></div>
            </div>

            <div id="treePanel" class="panel right hidden">
              <div class="panel-head"><h2>Pohon objek</h2><button class="icon-btn" id="closeTree" title="Tutup"></button></div>
              <div id="treeList" class="tree"></div>
            </div>

            <div id="alertPanel" class="panel right hidden">
              <div class="panel-head"><h2>Peringatan</h2><button class="icon-btn" id="closeAlert" title="Tutup"></button></div>
              <div class="search"><span class="search-ico"></span><input id="alertSearch" placeholder="Pencarian peringatan" /></div>
              <div class="seg2"><button data-at="list" class="on">Daftar</button><button data-at="log">Log</button></div>
              <div id="alertList" class="tree"></div>
              <button id="newAlert" class="primary block">Buat peringatan</button>
            </div>

            <div id="paperPanel" class="panel right hidden">
              <div class="panel-head"><h2>Paper trading</h2><button class="icon-btn" id="closePaper" title="Tutup"><svg class="i" viewBox="0 0 24 24"><path d="M6 6L18 18 M18 6L6 18"/></svg></button></div>
              <div id="paperBody" class="tree"></div>
            </div>

            <div id="hubPanel" class="panel right hidden">
              <div class="panel-head"><h2>Pusat analisis</h2><button class="icon-btn" id="closeHub" title="Tutup"></button></div>
              <div id="hubBody"></div>
            </div>
          </section>
        </main>
        <div id="replayBar" class="hidden"></div>
        <footer id="bottombar">
          <div class="bb-sym">
            <button id="symbolBtn" title="Ganti simbol"><b id="symName">XAUUSD</b></button>
            <button id="tfBtn" title="Ganti timeframe">5m</button>
          </div>
          <div class="bb-draw">
            <button class="icon-btn on" data-dm="tool" title="Alat aktif (ketuk untuk batal)"></button>
            <span class="bb-sep"></span>
            <button class="icon-btn" data-dm="magnet" title="Magnet"></button>
            <button class="icon-btn" data-dm="stay" title="Tetap menggambar"></button>
            <button class="icon-btn" data-dm="angle" title="Penggaris sudut"></button>
            <button class="icon-btn" data-dm="hide" title="Sembunyikan gambar"></button>
            <button class="icon-btn" data-dm="tree" title="Pohon objek"></button>
            <button class="icon-btn" data-dm="full" title="Layar penuh"></button>
          </div>
          <div class="bb-tools">
            <button class="icon-btn" data-bb="draw" title="Gambar"></button>
            <button class="icon-btn" data-bb="ind" title="Indikator"></button>
            <button class="icon-btn" data-bb="layout" title="Layout"></button>
            <button class="icon-btn" data-bb="alert" title="Peringatan"></button>
            <button class="icon-btn" data-bb="type" title="Jenis chart"></button>
            <button class="icon-btn" data-bb="replay" title="Replay bar"></button>
            <button class="icon-btn" data-bb="tree" title="Pohon objek"></button>
            <button class="icon-btn" data-bb="more" title="Pusat analisis"></button>
            <span class="bb-sep"></span>
            <button class="icon-btn" data-bb="undo" title="Batalkan"></button>
            <button class="icon-btn" data-bb="redo" title="Ulangi"></button>
            <button class="icon-btn" data-bb="full" title="Layar penuh"></button>
            <button class="icon-btn" data-bb="share" title="Bagikan"></button>
          </div>
        </footer>
      </section>

      <!-- ================= JELAJAHI ================= -->
      <section id="pg-explore" class="page">
        <header class="pg-head"><h1>Jelajahi</h1><span class="spacer"></span><select id="exBroker"><option value="oanda">OANDA</option><option value="forexcom">FOREX.com</option></select></header>
        <div id="exploreBody" class="pg-body"></div>
      </section>

      <!-- ================= MENU ================= -->
      <section id="pg-menu" class="page">
        <header class="pg-head"><h1>Menu</h1></header>
        <div id="menuBody" class="pg-body"></div>
      </section>
    </div>

    <nav id="tabbar">
      <button data-page="watch"><span></span>Daftar Pantau</button>
      <button data-page="chart"><span></span>Chart</button>
      <button data-page="explore"><span></span>Jelajahi</button>
      <button data-page="menu"><span></span>Menu</button>
    </nav>
  </div>

  <div id="popMenu" class="menu hidden"></div>

  <!-- Pencarian simbol -->
  <div id="searchModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-search">
        <button class="icon-btn" id="closeSearch" title="Kembali"></button>
        <input id="symSearch" placeholder="Simbol atau nama, mis. XAUUSD" autocomplete="off" />
      </div>
      <div id="symTabs" class="chips"></div>
      <div id="symList" class="sym-list"></div>
    </div>
  </div>

  <!-- Indikator, metrik dan strategi -->
  <div id="indModal" class="modal hidden">
    <div class="modal-box wide">
      <div class="panel-head"><h2>Indikator, metrik dan strategi</h2><button class="icon-btn" id="closeInd" title="Tutup"></button></div>
      <div class="search"><span class="search-ico"></span><input id="indSearch" placeholder="Cari" /></div>
      <div class="ind-wrap">
        <aside id="indNav" class="ind-nav"></aside>
        <div class="ind-main"><div id="indChips" class="chips"></div><div id="indList" class="sym-list"></div></div>
      </div>
    </div>
  </div>

  <!-- Form generik -->
  <div id="formModal" class="modal hidden">
    <div class="modal-box settings">
      <div class="panel-head"><h2 id="formTitle"></h2><button class="icon-btn" id="closeForm" title="Tutup"></button></div>
      <div id="formTabs" class="dtabs hidden"></div>
      <div id="formBody"></div>
      <div class="form-actions" id="formActions"></div>
    </div>
  </div>

  <!-- Pengaturan chart (ketuk 2x pada chart) -->
  <div id="chartSettings" class="modal center hidden">
    <div class="modal-box cs-box">
      <div class="panel-head"><h2>Pengaturan</h2><button class="icon-btn" data-x="cancel" title="Tutup"><svg class="i" viewBox="0 0 24 24"><path d="M6 6L18 18 M18 6L6 18"/></svg></button></div>
      <div class="cs-wrap"><nav class="cs-nav"></nav><div class="cs-body settings"></div></div>
      <div class="ds-foot"><button class="ghost" data-x="tpl">Template ▾</button><span class="spacer"></span><button class="ghost" data-x="cancel">Batal</button><button class="primary" data-x="ok">Ok</button></div>
    </div>
  </div>

  <!-- Pengaturan indikator (Input / Corak / Visibilitas) -->
  <div id="studySettings" class="modal center hidden"><div class="modal-box settings ds-box"></div></div>

  <!-- Pengaturan gambar -->
  <div id="drawSettings" class="modal center hidden"><div class="modal-box settings ds-box"></div></div>

  <!-- Pengaturan broker -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-box settings">
      <div class="panel-head"><h2>Akun Broker</h2><button class="icon-btn" id="closeSet" title="Tutup"></button></div>
      <p id="setNote" class="note"></p>
      <h3>OANDA</h3>
      <label>Token API<input id="oandaKey" type="password" autocomplete="off" /></label>
      <label>Akun<select id="oandaEnv"><option value="practice">Practice (demo)</option><option value="live">Live</option></select></label>
      <h3>FOREX.com</h3>
      <label>Username<input id="fxUser" autocomplete="off" /></label>
      <label>Password<input id="fxPass" type="password" autocomplete="off" /></label>
      <label>AppKey<input id="fxKey" type="password" autocomplete="off" /></label>
      <label>Base URL API (opsional)<input id="fxUrl" placeholder="https://ciapi.cityindex.com/TradingAPI" autocomplete="off" /></label>
      <label>MarketId manual (opsional, JSON)<input id="fxIds" placeholder='{"XAUUSD":401153869}' autocomplete="off" /></label>
      <button id="saveSet" class="primary">Simpan &amp; uji koneksi</button>
      <pre id="setStatus"></pre>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
